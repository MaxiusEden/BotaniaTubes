plugins {
    id 'eclipse'
    id 'idea'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

minecraft {
    mappings channel: mapping_channel, version: mapping_version

    copyIdeResources = true

    runs {
        configureEach {
            workingDirectory project.file('run')

            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'

            property 'mixin.env.remapRefMap', 'true'
            property 'mixin.env.refMapRemappingFile', "${projectDir}/build/createSrgToMcp/output.srg"

            args '-mixin.config=botaniatubes.mixins.json'

            mods {
                "${mod_id}" {
                    source sourceSets.main
                }
            }
        }

        client {
            workingDirectory project.file(project.findProperty('pasta') ?: 'run')
            if (project.hasProperty('jogador')) {
                args '--username', project.property('jogador')
            }
        }

        server {
            workingDirectory project.file('run-server')
            args '--nogui'
        }
    }
}

repositories {
    mavenCentral()
    maven { url = 'https://maven.minecraftforge.net/' }
    maven { url = 'https://modmaven.dev/' }
    maven { url = 'https://maven.blamejared.com' }
    maven { url = 'https://maven.theillusivec4.top/' }
    maven {
        url = 'https://api.modrinth.com/maven'
        content { includeGroup 'maven.modrinth' }
    }
}

def teste = project.hasProperty('teste')

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${teste ? teste_forge_version : forge_version}"
    implementation fg.deobf("vazkii.botania:Botania:${teste ? teste_botania_version : botania_version}")

    if (teste) {
        runtimeOnly fg.deobf("vazkii.patchouli:Patchouli:${teste_patchouli_version}")
        runtimeOnly fg.deobf("top.theillusivec4.curios:curios-forge:${teste_curios_version}")
        runtimeOnly fg.deobf("maven.modrinth:jade:${teste_jade_version}")
        runtimeOnly fg.deobf("mekanism:Mekanism:${teste_mekanism_version}")
    }
}

tasks.named('processResources', ProcessResources).configure {
    def replaceProperties = [
            minecraft_version_range: minecraft_version_range,
            forge_version_range: forge_version_range,
            loader_version_range: loader_version_range,
            mod_id: mod_id,
            mod_name: mod_name,
            mod_license: mod_license,
            mod_version: mod_version,
            mod_authors: mod_authors,
            mod_description: mod_description,
            botania_version_range: botania_version_range
    ]

    inputs.properties replaceProperties

    filesMatching('META-INF/mods.toml') {
        expand replaceProperties
    }
}

tasks.named('jar', Jar).configure {
    from('LICENSE')

    manifest {
        attributes([
                'MixinConfigs': 'botaniatubes.mixins.json',
                'Specification-Title': mod_id,
                'Specification-Vendor': mod_authors,
                'Specification-Version': '1',
                'Implementation-Title': project.name,
                'Implementation-Version': project.jar.archiveVersion,
                'Implementation-Vendor': mod_authors,
                'Implementation-Timestamp': new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
        ])
    }

    finalizedBy 'reobfJar'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
